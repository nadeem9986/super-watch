[env:esp32-c3-supermini]
platform = espressif32@6.10.0
board = lolin_c3_mini
framework = arduino, espidf
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3

[env:esp32dev]
; Classic ESP32 dev module (38-pin) + SSD1306 128x64 I2C OLED.
; Source: src/main_esp32.cpp (selected in src/CMakeLists.txt by target).
; Wiring: OLED/DS3231 SDA=21 SCL=22, buttons LEFT=25 SELECT=26 RIGHT=27 to GND.
platform = espressif32@6.10.0
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
build_flags =
  -D CORE_DEBUG_LEVEL=3
